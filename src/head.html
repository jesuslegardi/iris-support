<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<title>Iris — Help &amp; Support</title>
<meta name="description" content="Help with Iris: account and data deletion, habits, photographs, coaching, competitions and subscriptions. Available in ten languages.">
<style>
  :root{
    --ground:#0B0910; --surface:#15111C; --text:#EDE9F2; --muted:#A79FB5;
    --accent:#CF70EA; --rule:#272032; --shadow:rgba(0,0,0,.45);
  }
  @media (prefers-color-scheme: light){
    :root{
      --ground:#FBFAFC; --surface:#FFFFFF; --text:#1A1523; --muted:#5A5170;
      --accent:#8A2BA6; --rule:#E5E1EC; --shadow:rgba(26,21,35,.10);
    }
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--ground); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
      "Noto Sans","Noto Sans JP","Noto Sans KR","Noto Sans SC","Noto Sans TC",Arial,sans-serif;
    font-size:17px; line-height:1.65; font-synthesis-weight:none;
  }

  /* ---- header ---- */
  header{
    position:sticky; top:0; z-index:10; background:var(--ground);
    border-bottom:1px solid var(--rule);
  }
  @supports (backdrop-filter:blur(12px)){
    header{background:color-mix(in srgb,var(--ground) 86%,transparent); backdrop-filter:blur(12px)}
  }
  .bar{
    max-width:74ch; margin:0 auto; padding:.7rem 1.25rem;
    display:flex; align-items:center; gap:1rem; justify-content:space-between;
  }
  .mark{
    font-size:1.0rem; font-weight:650; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); text-decoration:none; white-space:nowrap;
  }
  .picker{position:relative; display:flex; align-items:center}
  .picker::after{
    content:""; position:absolute; right:.75rem; pointer-events:none;
    width:.42rem; height:.42rem; border-right:1.5px solid var(--muted);
    border-bottom:1.5px solid var(--muted); transform:translateY(-.12rem) rotate(45deg);
  }
  select{
    appearance:none; -webkit-appearance:none;
    background:var(--surface); color:var(--text); border:1px solid var(--rule);
    border-radius:8px; padding:.42rem 2rem .42rem .7rem;
    font:inherit; font-size:.92rem; cursor:pointer; max-width:14rem;
  }
  select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ---- content ---- */
  main{max-width:74ch; margin:0 auto; padding:2.5rem 1.25rem 5rem}
  article[data-lang]{display:none}
  article[data-lang].active{display:block}

  h1{
    font-size:clamp(1.85rem,5.2vw,2.5rem); line-height:1.18; font-weight:680;
    letter-spacing:-.018em; margin:0 0 .35rem; text-wrap:balance;
  }
  .effective{
    color:var(--muted); font-size:.94rem; margin:0 0 2.4rem;
    padding-bottom:1.6rem; border-bottom:1px solid var(--rule);
  }
  h2{
    font-size:1.16rem; font-weight:650; letter-spacing:-.005em; line-height:1.35;
    margin:2.9rem 0 .85rem; text-wrap:balance;
  }
  h2 .n{
    color:var(--accent); font-variant-numeric:tabular-nums;
    margin-right:.6rem; font-weight:600;
  }
  h3{font-size:1rem; font-weight:650; margin:1.8rem 0 .6rem}
  p{margin:0 0 1.05rem}
  ul{margin:0 0 1.15rem; padding-left:1.3rem}
  li{margin:0 0 .55rem}
  li::marker{color:var(--muted)}
  strong{font-weight:650}
  a{color:var(--accent); text-decoration:underline; text-underline-offset:2px}
  a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.9em; background:var(--surface); padding:.1em .35em; border-radius:4px;
  }

  /* a paragraph that must not be skimmed past */
  .note{
    background:var(--surface); border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0; padding:1rem 1.15rem; margin:0 0 1.15rem;
  }
  .note p:last-child{margin-bottom:0}

  .deletion{scroll-margin-top:5rem}
  .deletion h2{margin-top:0}

  .colophon{
    margin-top:3.5rem; padding-top:1.6rem; border-top:1px solid var(--rule);
    color:var(--muted); font-size:.8rem; line-height:1.6;
  }
  .colophon p{margin:0 0 .5rem}
  .colophon a{color:var(--muted)}

  noscript .ns{
    display:block; background:var(--surface); border:1px solid var(--rule);
    border-radius:8px; padding:.8rem 1rem; margin:0 0 2rem;
    color:var(--muted); font-size:.9rem;
  }
  @media (max-width:520px){
    body{font-size:16px}
    .bar{padding:.6rem 1rem}
    .mark{font-size:.9rem; letter-spacing:.1em}
    main{padding:2rem 1rem 4rem}
  }
  @media print{
    header{display:none} main{max-width:none}
    body{background:#fff; color:#000; font-size:11pt}
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="mark">Iris</span>
    <span class="picker">
      <label for="lang" hidden>Language</label>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="zh-Hans">简体中文</option>
        <option value="zh-Hant">繁體中文</option>
      </select>
    </span>
  </div>
</header>
<main>
<noscript><span class="ns">The language picker needs JavaScript. This page is showing English.</span></noscript>
